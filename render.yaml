services:
  - type: web
    name: nids-dashboard
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "cd dashboard && python manage.py migrate && python manage.py runserver 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_SETTINGS_MODULE
        value: "dashboard.settings"
